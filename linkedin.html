<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open LinkedIn | Lekha More</title>
  <meta name="description" content="Open Lekha More's LinkedIn profile." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <style>
    :root {
      --paper: #f6efe3;
      --paper-deep: #eadcc8;
      --ink: #15110f;
      --text: #332b26;
      --muted: #74685f;
      --line: rgba(21, 17, 15, 0.16);
      --terracotta: #964d34;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --shadow: 0 28px 80px rgba(45, 32, 22, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 12%, rgba(215, 174, 109, 0.35), transparent 28%),
        linear-gradient(135deg, var(--paper), var(--paper-deep));
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.55;
    }

    .card {
      width: min(560px, 100%);
      display: grid;
      gap: 18px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: rgba(255, 250, 241, 0.76);
      padding: clamp(28px, 7vw, 54px);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand img {
      width: 52px;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 50%;
      object-fit: cover;
    }

    .eyebrow {
      color: var(--terracotta);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(2.7rem, 10vw, 5.2rem);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.06em;
    }

    p {
      color: var(--muted);
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 6px;
    }

    .button {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 52px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font-weight: 850;
      text-decoration: none;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.38);
      color: var(--text);
    }

    .url {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.38);
      padding: 14px;
      color: var(--text);
      font-size: 0.92rem;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="assets/nav-logo.png" alt="" />
      <div>
        <div class="eyebrow">LinkedIn</div>
        <p>Lekha More</p>
      </div>
    </div>

    <h1>Open LinkedIn profile.</h1>
    <p>
      If your phone opens this page inside a QR scanner or social browser, use the button below. You can also copy the URL.
    </p>

    <div class="actions">
      <a class="button" href="https://www.linkedin.com/in/lekha-more/">Open LinkedIn</a>
      <a class="button secondary" href="contact.html">Back to contact card</a>
    </div>

    <p class="url">https://www.linkedin.com/in/lekha-more/</p>
  </main>
</body>
</html>
